<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SAPURAN MELAYANI SEPENUH HATI</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary-color: #1a56db;
      --secondary-color: #f3f4f6;
      --accent-color: #f59e0b;
      --text-dark: #1f2937;
      --text-light: #f9fafb;
      --shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      --transition: all 0.3s ease;
    }
    
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.7)), 
                  url('https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSA9bgiHTJX6hisUbMf_ur61UZZMz1HcPNXgw&s') center/cover no-repeat fixed;
      color: var(--text-light);
      text-align: center;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      max-width: 500px;
      width: 100%;
      padding: 40px 25px;
      background: rgba(0, 0, 0, 0.75);
      border-radius: 20px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .profile-section {
      position: relative;
      margin-bottom: 25px;
    }

    .profile-img {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      object-fit: contain;
      border: 4px solid white;
      box-shadow: var(--shadow);
      background-color: white;
      padding: 10px;
    }

    .badge {
      position: absolute;
      bottom: 10px;
      right: calc(50% - 70px);
      background-color: var(--accent-color);
      color: var(--text-dark);
      font-size: 12px;
      font-weight: bold;
      padding: 3px 10px;
      border-radius: 20px;
    }

    h1 {
      font-size: 24px;
      margin-bottom: 5px;
      font-weight: 700;
      color: var(--text-light);
    }

    .subtitle {
      font-size: 14px;
      margin-bottom: 15px;
      opacity: 0.9;
    }

    #jam-digital {
      font-size: 28px;
      font-weight: bold;
      margin-bottom: 25px;
      background: rgba(255, 255, 255, 0.1);
      padding: 10px;
      border-radius: 10px;
      display: inline-block;
      min-width: 150px;
    }

    .button-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 25px;
    }

    a.button {
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: var(--primary-color);
      color: var(--text-light);
      text-decoration: none;
      padding: 14px 20px;
      border-radius: 10px;
      font-weight: 600;
      transition: var(--transition);
      gap: 10px;
    }

    a.button:hover {
      background-color: #1e40af;
      transform: translateY(-2px);
      box-shadow: 0 6px 12px rgba(0, 0, 0, 0.2);
    }

    a.button.secondary {
      background-color: var(--secondary-color);
      color: var(--text-dark);
    }

    a.button.secondary:hover {
      background-color: #e5e7eb;
    }

    .icon {
      width: 20px;
      height: 20px;
    }

    iframe {
      width: 100%;
      height: 250px;
      border-radius: 15px;
      margin: 20px 0;
      border: none;
    }

    .social-links {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 15px;
      margin-top: 25px;
    }

    .social-links a {
      background: var(--secondary-color);
      border-radius: 50%;
      width: 50px;
      height: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: var(--transition);
    }

    .social-links a:hover {
      transform: scale(1.1);
      background-color: var(--accent-color);
    }

    .social-links img {
      width: 24px;
      height: 24px;
    }

    footer {
      margin-top: 30px;
      font-size: 12px;
      opacity: 0.8;
      border-top: 1px solid rgba(255, 255, 255, 0.2);
      padding-top: 15px;
    }

    /* Responsive adjustments */
    @media (max-width: 480px) {
      .container {
        padding: 30px 15px;
      }
      
      h1 {
        font-size: 20px;
      }
      
      .profile-img {
        width: 120px;
        height: 120px;
      }
      
      #jam-digital {
        font-size: 24px;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Foto Profil -->
    <div class="profile-section">
      <img class="profile-img" src="https://kecamatansapuran.wonosobokab.go.id/storage/profil/file_logo/MAPAN%20PNG%20(2)%20-%20Copy.png" alt="Logo Kecamatan Sapuran">
      <div class="badge">Resmi</div>
    </div>

    <!-- Judul -->
    <h1>KECAMATAN SAPURAN</h1>
    <p class="subtitle">Menu Layanan & Media Pembelajaran</p>

    <!-- Jam Digital -->
    <div id="jam-digital"></div>

    <!-- Tombol Link -->
    <div class="button-container">
      <a class="button" href="https://script.google.com/macros/s/AKfycbxgi7OdesOQGEyDjP0c-Anw-gKNuMtOoYcT_o8dzDSvSFBJ038khN1rnrnNCWO2uzcX8g/exec" target="_blank">
        <svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.94-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/>
        </svg>
        🌐 Buka Layanan WebApp
      </a>
      
      <a class="button secondary" href="https://wa.me/628123456789" target="_blank">
        <svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>
        </svg>
        📞 Hubungi Kami
      </a>
    </div>

    <!-- Embed YouTube -->
    <iframe src="https://www.youtube.com/embed/mXoKxmje2ps" title="Video Profil Kecamatan Sapuran" allowfullscreen></iframe>

    <!-- Menu Media Sosial -->
    <div class="social-links">
      <a href="https://www.facebook.com/" target="_blank" aria-label="Facebook">
        <img src="https://cdn-icons-png.flaticon.com/512/733/733547.png" alt="Facebook">
      </a>
      <a href="https://www.instagram.com/kecsapuran.official/?hl=en/" target="_blank" aria-label="Instagram">
        <img src="https://cdn-icons-png.flaticon.com/512/2111/2111463.png" alt="Instagram">
      </a>
      <a href="https://www.youtube.com/@kecamatansapuran718/" target="_blank" aria-label="YouTube">
        <img src="https://cdn-icons-png.flaticon.com/512/1384/1384060.png" alt="YouTube">
      </a>
      <a href="https://wa.me/628123456789" target="_blank" aria-label="WhatsApp">
        <img src="https://cdn-icons-png.flaticon.com/512/733/733585.png" alt="WhatsApp">
      </a>
      <a href="https://www.tiktok.com/" target="_blank" aria-label="TikTok">
        <img src="https://cdn-icons-png.flaticon.com/512/3046/3046121.png" alt="TikTok">
      </a>
    </div>

    <!-- Footer -->
    <footer>
      <p>Kecamatan Sapuran - Melayani Sepenuh Hati</p>
      <p>Author Widodo Tamvans</p>
    </footer>
  </div>

  <script>
    function updateJam() {
      const now = new Date();
      const jam = now.getHours().toString().padStart(2, '0');
      const menit = now.getMinutes().toString().padStart(2, '0');
      const detik = now.getSeconds().toString().padStart(2, '0');
      document.getElementById('jam-digital').textContent = `${jam}:${menit}:${detik}`;
    }
    
    // Update jam setiap detik
    setInterval(updateJam, 1000);
    updateJam();
    
    // Tambahkan efek saat halaman dimuat
    document.addEventListener('DOMContentLoaded', function() {
      document.querySelector('.container').style.opacity = '0';
      document.querySelector('.container').style.transform = 'translateY(20px)';
      
      setTimeout(function() {
        document.querySelector('.container').style.transition = 'opacity 0.5s ease, transform 0.5s ease';
        document.querySelector('.container').style.opacity = '1';
        document.querySelector('.container').style.transform = 'translateY(0)';
      }, 100);
    });
  </script>

</body>
</html>
